[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssz-all-tests"
version = "1.0.0"
description = "Complete SSZ test suite - 564+ tests across 8 Parts, 30 Modules"
readme = "README.md"
license = {text = "Anticapitalist License 1.4"}
authors = [
    {name = "Carmen N. Wrede"},
    {name = "Lino P. Casu"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "astropy>=5.0.0",
]
